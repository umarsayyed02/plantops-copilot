[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plantops-copilot"
version = "0.1.0"
description = "An evaluated, citation-first assistant for industrial maintenance documents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

