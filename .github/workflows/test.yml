name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plantops-copilot .
      - run: docker run --detach --name plantops-copilot --publish 8000:8000 --env PLANTOPS_ALLOW_UPLOADS=false plantops-copilot
      - name: Wait for the container health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs plantops-copilot
          exit 1
      - if: always()
        run: docker rm --force plantops-copilot || true

